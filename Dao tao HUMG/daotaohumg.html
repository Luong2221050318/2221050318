<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trường Đại ọc Mỏ - Địa chất</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục Một cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một Cửa online</a></li>
            <li class="muc"><a href="#" class="lien-ket">Email HUMG</a></li>
        </ul>
    </nav>
    <main>
        <div class="trai">
            <div class="khoi-dang-nhap">
                <form>
                    <div class="dang-nhap">
                        <div class="tai-khoan">
                            <p>Tài Khoản</p>
                            <input type="text">
                        </div>
                        <div class="mat-khau">
                            <p>Mật khẩu</p>
                            <input type="password">
                        </div>
                    </div>
                    <div class="quen-mk">
                        <a class="quan-sat-lien-ket"href="#">Quên mật khẩu?</a>
                    </div>
                    <div class="khoi-thong-tin">
                        <button class="dn">Đăng nhập</button>
                        <button class="dn-365">Đăng nhập bằng Microsoft office 365</button>
                    </div>
                    
                </form>
            </div>
        </div>
        <div class="phai">
            <div class="danh-sach-tin">
                <div class="tin">
                    <div class="tieu-de">
                        <div class="tin-tuc"> <a href="#">Tin tức</a></div>
                        <div class="xem-them"><a href="#">Xem thêm</a></div>

                    </div>
                    
                </div>
            </div>
        </div>
            
    </main>

</html>
