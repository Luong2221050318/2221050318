<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        h2{
            /* color quy định màu chữ */
            color: red; 
        }
    </style>
</head>
<body>
    <!-- Có 3 loại CSS Inline
                       Internal
                       External -->

    <!-- Kiểu 1 viết style trong thẻ Inline-->
     <h1 style="color: blue;">HUMG</h1>

    <!-- Kiểu 2  -->
     <h2>Trường Đại học Mỏ - Địa chất</h2>

     <h3>Lớp phát triển ứng dụng web</h3>

     <h2 id="tieuDe">Trường Đại học Mỏ - Địa chất</h2> <!-- viết dấu # trước id để gọi đến id trong CSS -->

     <h2 class="tieuDe">Trường Đại học Mỏ - Địa chất</h2> <!-- viết dấu . trước class để gọi đến class trong CSS -->
</body>
</html>
